aid: bionaut-labs
name: Bionaut Labs
description: 'Bionaut Labs is a clinical-stage medical robotics company headquartered
  in Los Angeles, California, developing "Bionauts" — remote-controlled, magnetically
  steered microscale robots roughly the size of a grain of rice that travel through
  tissue to deliver drugs, biologics and nucleic acids directly to targets deep in
  the brain and central nervous system. Founded in 2016 by CEO Michael Shpigelmacher,
  the company is pursuing treatments for malignant glioma, Dandy-Walker syndrome,
  Parkinson''s disease and Huntington''s disease, and has raised more than $80 million
  from investors including Khosla Ventures. Its product is a therapeutic device and
  navigation platform regulated as a medical device, not software sold to developers:
  Bionaut Labs operates no public API, developer portal, SDK or machine-readable
  contract of any kind.'
